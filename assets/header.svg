<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translate(915px, 93px); } 50% { transform: translate(915px, 84px); } }
    .status-dot { animation: pulse 2.2s ease-in-out infinite; }
    .code-mark { animation: float 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1140" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1628"/>
      <stop offset="1" stop-color="#100B24"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="85" x2="875" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(1010 40) rotate(135) scale(420 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(1120 340) rotate(-145) scale(500 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowCyan)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowViolet)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>

  <g opacity="0.8">
    <circle cx="56" cy="44" r="5" fill="#FB7185"/>
    <circle cx="76" cy="44" r="5" fill="#FBBF24"/>
    <circle cx="96" cy="44" r="5" fill="#34D399"/>
  </g>

  <g class="code-mark" filter="url(#softGlow)">
    <path d="M65 22L5 87L65 152" stroke="#22D3EE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M153 22L213 87L153 152" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M129 5L90 169" stroke="#E2E8F0" stroke-opacity="0.82" stroke-width="8" stroke-linecap="round"/>
  </g>

  <rect x="70" y="78" width="210" height="34" rx="17" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.45"/>
  <circle class="status-dot" cx="91" cy="95" r="5" fill="#22D3EE"/>
  <text x="107" y="101" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">FULL-STACK DEVELOPER</text>

  <text x="68" y="190" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-2">Manvesh Singh</text>
  <rect x="70" y="215" width="510" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="265" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Building useful products from interface to infrastructure.</text>
  <text x="70" y="306" fill="#64748B" font-family="Consolas, monospace" font-size="16">React  •  Next.js  •  Node.js  •  TypeScript</text>
</svg>
